<!DOCTYPE html>
<html lang="th" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#FF8A5B">
<title>Present Perfect Continuous · Pretest & Post-test · ม.6 · By T.OAT</title>
<style>
:root{
  --bg:#FFF8F1; --ink:#2A2142; --sub:#6E6688; --line:#F0E6F2; --card:#FFFFFF;
  --coral:#FF6B6B; --orange:#FF9F43; --sun:#FFC93C; --violet:#7C5CFF; --sky:#38BDF8; --mint:#12B8A6; --pink:#FF7EB6;
  --g-pre:linear-gradient(135deg,#FF6B6B 0%,#FF9F43 55%,#FFC93C 100%);
  --g-post:linear-gradient(135deg,#7C5CFF 0%,#38BDF8 60%,#12B8A6 100%);
  --g-rain:linear-gradient(90deg,#FF6B6B,#FF9F43,#FFC93C,#12B8A6,#38BDF8,#7C5CFF,#FF7EB6);
  --shadow:0 18px 50px -18px rgba(90,50,120,.28),0 4px 14px -6px rgba(90,50,120,.12);
  --r:24px;
  --font:"Segoe UI","Noto Sans Thai","Leelawadee UI","Thonburi","Sukhumvit Set",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);overflow-x:hidden;line-height:1.55;-webkit-font-smoothing:antialiased}
body.has-bg{background:var(--bg) var(--bgimg) center/cover fixed no-repeat}
body.has-bg::before{content:"";position:fixed;inset:0;background:rgba(255,248,241,.82);z-index:0;pointer-events:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* ===== ambient background ===== */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform}
.b1{width:46vmax;height:46vmax;background:#FFD3B6;top:-14vmax;left:-10vmax;animation:fl1 22s ease-in-out infinite}
.b2{width:40vmax;height:40vmax;background:#D9CCFF;top:-8vmax;right:-14vmax;animation:fl2 26s ease-in-out infinite}
.b3{width:38vmax;height:38vmax;background:#C6F1EA;bottom:-16vmax;left:20vmax;animation:fl3 30s ease-in-out infinite}
.b4{width:24vmax;height:24vmax;background:#FFE7A3;bottom:6vmax;right:-6vmax;animation:fl2 24s ease-in-out infinite reverse}
@keyframes fl1{50%{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes fl2{50%{transform:translate(-6vmax,8vmax) scale(.94)}}
@keyframes fl3{50%{transform:translate(-8vmax,-6vmax) scale(1.1)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(124,92,255,.10) 1.2px,transparent 1.3px);background-size:26px 26px;mask-image:linear-gradient(180deg,#000 0,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 70%)}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:22px 18px 110px}
.screen{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ===== top bar ===== */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;max-width:1120px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--g-pre);display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;box-shadow:0 8px 20px -8px #FF6B6B;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand small{display:block;font-weight:600;color:var(--sub);font-size:12px;letter-spacing:.3px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--sub);box-shadow:0 2px 8px -4px rgba(90,50,120,.2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(18,184,166,.18)}
.chip.off .dot{background:#bbb;box-shadow:none}

/* ===== common UI ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(240,230,242,.9)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .15s,box-shadow .2s,filter .2s;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-pre{background:var(--g-pre);color:#fff;box-shadow:0 12px 26px -12px #FF6B6B}
.btn-post{background:var(--g-post);color:#fff;box-shadow:0 12px 26px -12px #7C5CFF}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#e2d4ea}
.btn-dark{background:var(--ink);color:#fff}
.btn-sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn:hover{filter:brightness(1.04)}
.h1{font-size:clamp(28px,4.6vw,52px);line-height:1.12;font-weight:900;letter-spacing:-.5px}
.grad{background:var(--g-rain);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:200% center}}
.muted{color:var(--sub)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:14px;color:var(--sub)}
.input,.select{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus,.select:focus{border-color:#FFB38A;box-shadow:0 0 0 4px rgba(255,159,67,.18)}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9a8fb0 50%),linear-gradient(135deg,#9a8fb0 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}

/* ===== hero ===== */
.hero{position:relative;border-radius:32px;overflow:hidden;padding:34px clamp(20px,4vw,48px);display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;background:linear-gradient(135deg,#FFFFFF 0%,#FFF3E8 55%,#F3EEFF 100%);box-shadow:var(--shadow);border:1px solid #fff}
.hero.img{background-size:cover;background-position:center}
.hero.img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.82) 50%,rgba(255,255,255,.25) 100%)}
.hero>*{position:relative}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:#E2553F;background:#FFE9DE;padding:6px 12px;border-radius:999px}
.hero p.lead{font-size:17px;color:var(--sub);margin:14px 0 18px;max-width:560px}
.formula{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800;font-size:15px}
.formula span{padding:7px 12px;border-radius:12px;background:#fff;border:1.5px dashed #FFC2A6}
.formula span.v{border-color:#C8B8FF;color:var(--violet)}
.formula b{color:#C4B8D6}
.hero-art{display:flex;justify-content:center}
.hero-art svg{width:100%;max-width:360px;height:auto;filter:drop-shadow(0 18px 30px rgba(124,92,255,.22))}
.float{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.spin-slow{transform-origin:150px 150px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.announce{margin-top:16px;padding:14px 18px;border-radius:18px;background:linear-gradient(90deg,#FFF4D6,#FFE9F2);border:1px solid #FFE0A3;font-weight:700;display:flex;gap:10px;align-items:flex-start}

/* ===== login ===== */
.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.login-card{padding:28px}
.step-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin-bottom:16px}
.num{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:15px;background:var(--g-pre);flex:none}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cls{padding:20px 10px;border-radius:20px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:24px;transition:all .2s;position:relative;overflow:hidden}
.cls small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.cls:hover{transform:translateY(-2px);border-color:#FFC9AE}
.cls.on{border-color:transparent;background:var(--g-pre);color:#fff;box-shadow:0 14px 28px -14px #FF6B6B}
.cls.on small{color:#fff}
.who{margin-top:16px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#FFF6EE,#F5F0FF);display:flex;gap:14px;align-items:center}
.avatar{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;background:var(--g-post);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.rules{display:grid;gap:10px;margin:6px 0 18px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:#FCFAFF;border:1px solid var(--line);font-size:15px}
.rule i{font-style:normal;font-size:20px;line-height:1.2}

/* ===== hub ===== */
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hello h2{font-size:clamp(22px,3vw,30px);font-weight:900}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tcard{position:relative;overflow:hidden;border-radius:30px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .25s}
.tcard:hover{transform:translateY(-4px)}
.tcover{height:190px;position:relative;display:flex;align-items:flex-end;padding:20px;color:#fff;background-size:cover;background-position:center}
.tcover.pre{background-image:var(--g-pre)}
.tcover.post{background-image:var(--g-post)}
.tcover.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(30,10,50,.55) 100%)}
.tcover>*{position:relative}
.tcover .big{font-size:40px;font-weight:900;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.18)}
.tcover .tag{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}
.tcover .deco{position:absolute;right:-20px;top:-20px;width:170px;height:170px;opacity:.9}
.tbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;border-radius:16px;background:#FBF8FF;border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:24px;font-weight:900;line-height:1.1}
.stat span{font-size:12px;color:var(--sub);font-weight:700}
.closed{padding:12px;border-radius:14px;background:#F4F2F7;color:var(--sub);text-align:center;font-weight:800}
.compare{margin-top:22px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.gain{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(#12B8A6 var(--p,0%),#EDE7F5 0);position:relative}
.gain::after{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}
.gain div{position:relative;z-index:1;font-weight:900;font-size:26px;line-height:1}
.gain small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;font-weight:800;font-size:14px}
.bar{height:16px;border-radius:999px;background:#F1ECF7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.info-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* ===== face scan ===== */
.face-wrap{max-width:560px;margin:0 auto;padding:26px;text-align:center}
.cam{position:relative;width:100%;max-width:360px;aspect-ratio:3/4;margin:16px auto;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,#2A2142,#3d2f63)}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .oval{position:absolute;left:50%;top:46%;width:62%;height:62%;transform:translate(-50%,-50%);border-radius:50%;border:4px dashed rgba(255,255,255,.75);box-shadow:0 0 0 999px rgba(42,33,66,.38);transition:border-color .3s}
.cam .oval.ok{border-style:solid;border-color:#3BE3B0}
.cam .scanline{position:absolute;left:19%;right:19%;height:3px;top:20%;background:linear-gradient(90deg,transparent,#7CF7D4,transparent);animation:scan 2.2s ease-in-out infinite;border-radius:4px}
@keyframes scan{50%{top:72%}}
.cam .pct{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px}
.cam .nocam{position:absolute;inset:0;display:grid;place-items:center;color:#fff;padding:24px;font-weight:700}
.prog{height:10px;border-radius:999px;background:#EEE8F6;overflow:hidden;margin:6px auto 0;max-width:360px}
.prog i{display:block;height:100%;width:0;background:var(--g-post);transition:width .2s}
.codebox{display:flex;gap:10px;max-width:360px;margin:14px auto 0}
.codebox .input{text-align:center;font-size:22px;font-weight:900;letter-spacing:8px}

/* ===== quiz ===== */
.qtop{position:sticky;top:0;z-index:5;padding:12px 0 10px;background:linear-gradient(180deg,var(--bg) 70%,rgba(255,248,241,0))}
.qtop-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mode-pill{padding:8px 14px;border-radius:999px;color:#fff;font-weight:900;font-size:14px}
.mode-pill.pre{background:var(--g-pre)}.mode-pill.post{background:var(--g-post)}
.qprog{height:12px;border-radius:999px;background:#EFE8F6;overflow:hidden;margin-top:10px}
.qprog i{display:block;height:100%;background:var(--g-rain);background-size:200% 100%;animation:shine 6s linear infinite;transition:width .4s}
.qcard{padding:clamp(20px,4vw,40px);margin-top:10px;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#FFF0E3,transparent 70%)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;position:relative}
.lv{padding:5px 12px;border-radius:999px;font-weight:900;font-size:13px}
.lv.easy{background:#DDF8F1;color:#0C8A7A}.lv.medium{background:#FFF0D2;color:#B26B00}.lv.hard{background:#FFE0E6;color:#D23A5A}
.qtype{font-size:13px;font-weight:800;color:var(--sub);background:#F5F1FA;padding:5px 12px;border-radius:999px}
.qno{font-size:15px;font-weight:900;color:#C1B5D3;margin-left:auto}
.qtext{font-size:clamp(19px,2.6vw,25px);font-weight:800;line-height:1.55;position:relative}
.qtext .th{display:block;font-size:15px;font-weight:600;color:var(--sub);margin-top:6px}
.blank{display:inline-block;min-width:110px;border-bottom:3px dashed #FFAA7A;margin:0 4px;transform:translateY(-4px)}
.mark{text-decoration:none;border-bottom:3px solid #B9A5FF;background:#F3EEFF;padding:0 4px;border-radius:6px}
.qimg{margin:14px 0 4px;border-radius:18px;max-height:240px;object-fit:cover;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;position:relative}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:16px 18px;border-radius:18px;background:#fff;border:2px solid var(--line);font-size:17px;font-weight:700;transition:all .18s;min-height:64px}
.opt:hover{border-color:#FFCFB5;transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(255,107,107,.6)}
.opt .k{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:#F6F1FB;color:var(--sub);flex:none;transition:all .18s}
.opt.sel{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,var(--g-pre) border-box;border:2.5px solid transparent;box-shadow:0 12px 24px -14px #FF6B6B}
.opt.sel .k{background:var(--g-pre);color:#fff}
body.m-post .opt.sel{background:linear-gradient(#fff,#fff) padding-box,var(--g-post) border-box;box-shadow:0 12px 24px -14px #7C5CFF}
body.m-post .opt.sel .k{background:var(--g-post)}
.qnav{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.qmap{display:grid;grid-template-columns:repeat(15,1fr);gap:8px;margin-top:16px;padding:16px}
.qdot{height:42px;border-radius:12px;background:#F4F0F9;font-weight:900;font-size:14px;color:var(--sub);border:2px solid transparent}
.qdot.done{background:#E9FBF6;color:#0C8A7A}
.qdot.cur{border-color:var(--orange);color:var(--ink)}
.timer{font-variant-numeric:tabular-nums}

/* ===== result ===== */
.res-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:22px;align-items:start}
.res-hero{padding:30px;text-align:center;position:relative;overflow:hidden}
.ring{width:210px;height:210px;margin:10px auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .center b{font-size:56px;font-weight:900;line-height:1}
.ring .center span{font-weight:800;color:var(--sub)}
.badge-big{display:inline-block;margin-top:8px;padding:8px 18px;border-radius:999px;font-weight:900;color:#fff}
.lvrow{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center;font-weight:800;margin:10px 0}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.review{margin-top:22px;padding:22px}
.rv{padding:16px;border-radius:18px;border:1.5px solid var(--line);margin-top:12px;background:#fff}
.rv.ok{border-color:#B9EEDF;background:#F6FFFC}.rv.no{border-color:#FFD0D8;background:#FFF8F9}
.rv .ans{margin-top:8px;font-size:15px;font-weight:700}
.rv .ex{margin-top:8px;font-size:14px;color:var(--sub);background:#FBF8FF;border-radius:12px;padding:10px 12px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ===== modal / toast ===== */
.modal-bg{position:fixed;inset:0;background:rgba(42,33,66,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:460px;background:#fff;border-radius:28px;padding:26px;box-shadow:0 30px 80px -20px rgba(42,33,66,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h3{font-size:22px;font-weight:900;margin-bottom:8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.tmsg{position:relative;overflow:hidden;max-width:500px}
.tmsg::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--g-rain)}
.tmsg .from{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tmsg .bubble{background:linear-gradient(135deg,#FFF3E8,#F3EEFF);border-radius:20px;padding:18px;font-size:20px;font-weight:800;white-space:pre-wrap;word-break:break-word}
.ring-anim{animation:wiggle 1s ease-in-out 2}
@keyframes wiggle{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast div{background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:pop .3s;max-width:90vw}
.toast div.warn{background:#E2553F}.toast div.good{background:#0E9F8E}
.imgprev{max-height:62vh;margin:0 auto;border-radius:18px;box-shadow:var(--shadow)}

/* ===== chat ===== */
.chat-fab{position:fixed;right:18px;bottom:18px;z-index:70;width:62px;height:62px;border-radius:22px;background:var(--g-post);color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 16px 32px -12px #7C5CFF}
.chat-fab .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:#FF4D6D;color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}

.chat-head{padding:14px 16px;background:var(--g-post);color:#fff;display:flex;align-items:center;gap:10px;font-weight:900}

.msg.me{align-self:flex-end;background:var(--g-pre);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
.chat-form .input{padding:12px 14px}
.chat-empty{margin:auto;text-align:center;color:var(--sub);font-weight:700;font-size:14px}

.kpi{padding:16px;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:28px;font-weight:900;line-height:1.1}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:10px 16px;border-radius:14px;font-weight:900;background:#fff;border:1.5px solid var(--line)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input,.toolbar .select{width:auto;padding:10px 14px;font-size:15px}
.tbl-wrap{overflow:auto;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
th{position:sticky;top:0;background:#FBF7FF;text-align:left;padding:12px 10px;font-weight:900;color:var(--sub);font-size:13px;border-bottom:1px solid var(--line);z-index:1}
td{padding:10px;border-bottom:1px solid #F6F0F8;vertical-align:middle}
tr:hover td{background:#FFFBF7}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.st i{width:9px;height:9px;border-radius:50%;background:#C9C2D4}
.st.on i{background:#12B8A6;box-shadow:0 0 0 3px rgba(18,184,166,.2)}
.st.quiz i{background:#FF9F43;box-shadow:0 0 0 3px rgba(255,159,67,.25);animation:blink 1.2s infinite}

.sc{font-weight:900}.sc small{color:var(--sub);font-weight:700}
.ib{padding:7px 10px;border-radius:10px;background:#F5F1FA;font-weight:800;font-size:13px;position:relative}
.ib:hover{background:#EDE5F7}
.ib .badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:#FF4D6D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:75;background:#fff;box-shadow:-20px 0 60px -20px rgba(42,33,66,.4);display:flex;flex-direction:column;animation:slide .3s cubic-bezier(.2,.8,.2,1)}

.switch button.on{background:var(--mint);color:#fff;border-color:var(--mint)}
.switch button.on.off{background:#9C93AE;border-color:#9C93AE}
.cls-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.foot{text-align:center;color:var(--sub);font-size:13px;font-weight:700;padding:20px 0 30px}

<script>
'use strict';
/* =========================================================
   CONFIG — วาง URL ของ Google Apps Script (ลงท้าย /exec) ตรงนี้
   ถ้าเว้นว่าง ระบบจะทำงานแบบ "โหมดทดลอง" (เก็บข้อมูลในเครื่อง)
   ========================================================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzY977k_vffMeoIZF3B9ZF7tc1bsAIFwFCJ0p_Z2V73mVoQeV0VtnH73FGkRcGSdR7Evw/exec';
const CLASSES = ['6/1','6/2','6/3'];
const OFFLINE_PIN = '7846', OFFLINE_FACECODE = '1112';
const PING_MS = 5000, ADMIN_POLL_MS = 3000;

/* =========================================================
   ข้อสอบ 30 ข้อ (Pretest และ Post-test ใช้ชุดเดียวกัน)
   lv: easy | medium | hard   a: index คำตอบถูก (0-3)
   [[...]] = ส่วนที่ขีดเส้นใต้ · ___ = ช่องว่าง · img: ลิงก์รูป (ถ้ามี)
   ========================================================= */
const QUESTIONS = [
 {lv:'easy',t:'เติมคำ',q:'She ___ English for three years.',o:['has been studying','have been studying','is studying','studied'],a:0,ex:'ประธาน She (เอกพจน์) ใช้ has been + V-ing และมี for three years บอกช่วงเวลาที่ทำต่อเนื่องจนถึงตอนนี้'},
 {lv:'easy',t:'เติมคำ',q:'They ___ football since 4 p.m.',o:['have been playing','has been playing','are play','plays'],a:0,ex:'They (พหูพจน์) ใช้ have been + V-ing · since 4 p.m. = ตั้งแต่ 4 โมงเย็นจนถึงตอนนี้'},
 {lv:'easy',t:'for / since',q:'I have been waiting here ___ two hours.',o:['for','since','in','at'],a:0,ex:'for + ระยะเวลา (two hours) · since + จุดเริ่มต้นของเวลา'},
 {lv:'easy',t:'for / since',q:'It has been raining ___ this morning.',o:['since','for','during','ago'],a:0,ex:'this morning คือจุดเริ่มต้นของเวลา จึงใช้ since'},
 {lv:'easy',t:'โครงสร้าง',q:'ข้อใดคือโครงสร้างของ Present Perfect Continuous Tense?',o:['S + has/have + been + V-ing','S + has/have + V3','S + is/am/are + V-ing','S + had been + V-ing'],a:0,ex:'Present Perfect Continuous = S + has/have + been + V-ing (ข้อ 2 = Present Perfect, ข้อ 3 = Present Continuous, ข้อ 4 = Past Perfect Continuous)'},
 {lv:'easy',t:'เติมคำ',q:'We ___ been working on this project all week.',o:['have','has','are','were'],a:0,ex:'We ใช้ have → have been working'},
 {lv:'easy',t:'เติมคำ',q:'He has been ___ TV for an hour.',o:['watching','watch','watched','watches'],a:0,ex:'หลัง been ต้องเป็น V-ing เสมอ → been watching'},
 {lv:'easy',t:'ปฏิเสธ',q:'My brother ___ feeling well lately.',o:["hasn't been","haven't been","isn't been","didn't been"],a:0,ex:"ประโยคปฏิเสธ: S + has/have + not + been + V-ing · My brother (เอกพจน์) → hasn't been"},
 {lv:'easy',t:'คำถาม',q:'___ you been crying? Your eyes are red.',o:['Have','Has','Were','Do'],a:0,ex:'ประโยคคำถาม: Has/Have + S + been + V-ing? · you ใช้ Have'},
 {lv:'easy',t:'ความหมาย',q:'"I have been learning to drive since January." แปลว่าอะไร?',o:['ฉันเรียนขับรถมาตั้งแต่เดือนมกราคม และยังเรียนอยู่','ฉันเรียนขับรถเสร็จแล้วเมื่อเดือนมกราคม','ฉันจะเริ่มเรียนขับรถในเดือนมกราคม','ฉันเคยเรียนขับรถครั้งเดียวเมื่อเดือนมกราคม'],a:0,ex:'Present Perfect Continuous = การกระทำที่เริ่มในอดีตและยังทำต่อเนื่องมาจนถึงปัจจุบัน'},

 {lv:'medium',t:'สถานการณ์',q:'Nida is tired because she ___ in the garden all afternoon.',o:['has been working','is working','works','will work'],a:0,ex:'ผลที่เห็นตอนนี้ (เหนื่อย) มาจากการกระทำต่อเนื่องที่เพิ่งผ่านมา → has been working'},
 {lv:'medium',t:'คำถาม How long',q:"You're still at the bus stop! How long ___ for the bus?",o:['have you been waiting','did you wait','are you waiting','you have been waiting'],a:0,ex:'ยังรออยู่ (still) จึงใช้ How long + have + S + been + V-ing? และต้องสลับ have ไว้หน้าประธาน'},
 {lv:'medium',t:'สถานการณ์',q:'The children are dirty. They ___ in the mud.',o:['have been playing','have played','play','are played'],a:0,ex:'เห็นร่องรอยตอนนี้ (ตัวเลอะ) จากการกระทำต่อเนื่องที่เพิ่งผ่านมา → have been playing'},
 {lv:'medium',t:'for / since',q:'Somchai has been living in Bangkok ___ he was ten.',o:['since','for','when','until'],a:0,ex:'since + ประโยค (he was ten) = ตั้งแต่ตอนเขาอายุสิบขวบ'},
 {lv:'medium',t:'หาที่ผิด',q:'Mali [[have been]] [[practicing]] the piano [[for]] [[two hours]].',o:['have been','practicing','for','two hours'],a:0,ex:'Mali เป็นประธานเอกพจน์ ต้องใช้ has been ไม่ใช่ have been'},
 {lv:'medium',t:'บทสนทนา',q:'A: "Why are you so sweaty?"\nB: "I ___ for an hour."',o:['have been jogging','jog','will jog','am jog'],a:0,ex:'เหงื่อออก (ผลตอนนี้) เพราะวิ่งต่อเนื่องมาหนึ่งชั่วโมง → have been jogging'},
 {lv:'medium',t:'เติมคำ',q:'Our teacher ___ at this school since 2015.',o:['has been teaching','have been teaching','teaches','taught'],a:0,ex:'Our teacher (เอกพจน์) + since 2015 (เริ่มในอดีต ยังสอนอยู่) → has been teaching'},
 {lv:'medium',t:'ปฏิเสธ',q:"We ___ much attention in class recently. We need to focus more.",o:["haven't been paying","hasn't been paying","didn't been paying","aren't paid"],a:0,ex:"We ใช้ have → haven't been paying · recently เป็นคำบอกเวลาที่ใช้กับ tense นี้ได้"},
 {lv:'medium',t:'คำถาม',q:'What ___ lately? You look so happy!',o:['have you been doing','has you been doing','did you been doing','you have been doing'],a:0,ex:'Wh- + have/has + S + been + V-ing? · you ใช้ have'},
 {lv:'medium',t:'คำบอกเวลา',q:'คำใด "ไม่" ใช้กับ Present Perfect Continuous Tense?',o:['yesterday','for','since','lately'],a:0,ex:'yesterday บอกเวลาในอดีตที่จบแล้ว ใช้กับ Past Simple · for / since / lately / recently / all day ใช้กับ tense นี้ได้'},

 {lv:'hard',t:'Stative verb',q:'เลือกประโยคที่ถูกต้อง',o:['I have known her for ten years.','I have been knowing her for ten years.','I has been knowing her for ten years.','I am knowing her for ten years.'],a:0,ex:'know เป็น stative verb (กริยาแสดงสภาพ) ไม่ใช้รูป continuous จึงต้องใช้ Present Perfect: have known'},
 {lv:'hard',t:'เขียนใหม่',q:'"He started reading the novel two hours ago. He is still reading it." มีความหมายตรงกับข้อใด?',o:['He has been reading the novel for two hours.','He read the novel two hours ago.','He has read the novel since two hours.','He is reading the novel two hours ago.'],a:0,ex:'เริ่มเมื่อ 2 ชม.ก่อน + ยังอ่านอยู่ = has been reading … for two hours (ใช้ for กับระยะเวลา ไม่ใช่ since)'},
 {lv:'hard',t:'PP vs PPC',q:'I ___ three cups of coffee this morning.',o:['have drunk','have been drinking','am drinking','had been drinking'],a:0,ex:'เมื่อบอก "จำนวน" ที่ทำเสร็จแล้ว (three cups) ใช้ Present Perfect ไม่ใช้ Continuous'},
 {lv:'hard',t:'PP vs PPC',q:"She ___ the report all morning, but she hasn't finished it yet.",o:['has been writing','has written','wrote','writes'],a:0,ex:'ยังไม่เสร็จ + เน้นความต่อเนื่อง (all morning) → has been writing'},
 {lv:'hard',t:'PP vs PPC',q:'I ___ my essay. You can read it now.',o:['have written','have been writing','am writing','write'],a:0,ex:'งานเสร็จแล้ว อ่านได้เลย = เน้นผลที่สำเร็จ → Present Perfect: have written'},
 {lv:'hard',t:'Stative verb',q:'This old bag ___ to my family since I was a child.',o:['has belonged','has been belonging','is belonging','belongs'],a:0,ex:'belong เป็น stative verb ไม่ใช้รูป -ing จึงใช้ has belonged'},
 {lv:'hard',t:'เลือกประโยค',q:'ประโยคใดใช้ Present Perfect Continuous ได้ถูกต้อง?',o:['I have been visiting my grandparents every weekend since March.','I have been visiting Japan three times.','They have been arrived since noon.','She has been finishing her homework at 8 p.m. yesterday.'],a:0,ex:'ใช้ได้กับการกระทำซ้ำ ๆ ต่อเนื่องจากอดีตถึงปัจจุบัน · บอกจำนวนครั้ง (three times) ใช้ PP · been arrived ผิดรูป · yesterday ใช้ Past Simple'},
 {lv:'hard',t:'หาที่ผิด',q:"[[I've been trying]] to call you [[since an hour]], but [[your phone]] [[has been]] off.",o:["I've been trying",'since an hour','your phone','has been'],a:1,ex:'an hour เป็นระยะเวลา ต้องใช้ for an hour ไม่ใช่ since'},
 {lv:'hard',t:'PP vs PPC',q:'How many pages ___ so far?',o:['have you written','have you been writing','are you writing','did you been writing'],a:0,ex:'How many (ถามจำนวนที่ทำได้แล้ว) ใช้ Present Perfect: have you written'},
 {lv:'hard',t:'สถานการณ์',q:'สถานการณ์: คุณเริ่มทำความสะอาดห้องตอน 9 โมง ตอนนี้ 11 โมงแล้วและยังทำอยู่ ควรพูดว่าอย่างไร?',o:['I have been cleaning for two hours.','I cleaned for two hours.','I have cleaned two hours ago.','I am cleaning since 9 o’clock.'],a:0,ex:'เริ่มในอดีต ยังทำอยู่ เน้นช่วงเวลาต่อเนื่อง → have been cleaning for two hours'}
];
const LV_TH = {easy:'ง่าย',medium:'ปานกลาง',hard:'ยาก'};

/* =========================================================
   Utilities
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const sess = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} }
};
function toast(msg, type){
  const d = document.createElement('div');
  if (type) d.className = type;
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 3200);
}
function fmtTime(sec){ sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function nowTh(){ return new Date().toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'}); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function initials(name){ return (String(name || '?').trim()[0] || '?'); }
function fmtTs(t){ const m = String(t || '').match(/(\d{1,2}:\d{2})(:\d{2})?$/); return m ? m[1] : String(t || ''); }
function isOn(v){ return String(v).toUpperCase() === 'TRUE'; }

/* sound (Web Audio, no files) */
let AC = null;
function beep(type){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const seq = {
      tap:[[660,.05]], ok:[[660,.08],[880,.12]], ding:[[880,.12],[1320,.22],[1760,.3]],
      warn:[[300,.15],[220,.2]], done:[[523,.1],[659,.1],[784,.1],[1047,.3]]
    }[type] || [[600,.08]];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .85;
    });
  }catch(e){}
}

/* =========================================================
   API (Google Apps Script) + โหมดทดลองในเครื่อง
   ========================================================= */
let netOK = true;
function setNet(ok, txt){
  netOK = ok;
  const c = $('#netChip'); if (!c) return;
  c.classList.toggle('off', !ok);
  $('#netTxt').textContent = txt || (ok ? (GAS_URL ? 'ออนไลน์' : 'โหมดทดลอง') : 'ออฟไลน์');
}
async function api(action, data){
  const body = Object.assign({action}, data || {});
  if (!GAS_URL) return Demo.call(body);
  try{
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const tm = ctl ? setTimeout(() => ctl.abort(), 25000) : null;
    const r = await fetch(GAS_URL, {method:'POST', body:JSON.stringify(body), redirect:'follow', signal:ctl ? ctl.signal : undefined});
    if (tm) clearTimeout(tm);
    const j = await r.json();
    setNet(true);
    return j;
  }catch(e){
    setNet(false);
    return {ok:false, error:'network'};
  }
}

/* Demo backend: mirrors Code.gs using localStorage (open 2 tabs to test chat) */
const Demo = (() => {
  const ROSTER = [
    ['6/1',1,'กานต์ ใจดี'],['6/1',2,'ข้าวหอม สุขใจ'],['6/1',3,'คณิน รักเรียน'],['6/1',4,'จิราพร ศรีสุข'],
    ['6/2',1,'ชนาธิป มีชัย'],['6/2',2,'ญาดา แสงทอง'],['6/2',3,'ณัฐวุฒิ พงษ์ดี'],
    ['6/3',1,'ธนพร วงศ์ใหญ่'],['6/3',2,'นภัสสร ทองคำ'],['6/3',3,'ปิยะพงษ์ ศักดิ์ดี']
  ].map(([cls, no, name]) => ({cls, no:String(no), name, key:cls + '|' + no + '|' + name}));
  const DEF = {pin:OFFLINE_PIN, faceCode:OFFLINE_FACECODE, faceScan:'TRUE', antiCheat:'TRUE', deviceOneUser:'FALSE', preOpen:'TRUE', postOpen:'TRUE',
    showReviewPre:'FALSE', showReviewPost:'TRUE', announce:'', heroImg:'', logoImg:'', preImg:'', postImg:'', bgImg:''};
  const NOTES = {pin:'รหัสเข้าหน้าครู', faceCode:'รหัสแทนการสแกนหน้า', faceScan:'TRUE = ต้องสแกนหน้าก่อนสอบ', antiCheat:'TRUE = นับการสลับแท็บ',
    deviceOneUser:'TRUE = 1 เครื่องใช้ได้แค่ 1 คน', preOpen:'เปิด Pretest', postOpen:'เปิด Post-test', showReviewPre:'แสดงเฉลยหลัง Pretest', showReviewPost:'แสดงเฉลยหลัง Post-test',
    announce:'ข้อความประกาศ', heroImg:'รูปแบนเนอร์ (1600×600)', logoImg:'โลโก้ (256×256)', preImg:'การ์ด Pretest (800×500)', postImg:'การ์ด Post-test (800×500)', bgImg:'พื้นหลัง (1920×1080)'};
  const K = 'ppc_demo_db_v1';
  const load = () => { const d = store.get(K, null) || {}; d.status = d.status || {}; d.results = d.results || []; d.msgs = d.msgs || []; d.pres = d.pres || {}; d.settings = Object.assign({}, DEF, d.settings || {}); d.setver = d.setver || '0'; return d; };
  const save = d => store.set(K, d);
  const pub = s => { const o = Object.assign({}, s); delete o.pin; delete o.faceCode; return o; };
  const blank = r => ({key:r.key, name:r.name, cls:r.cls, no:r.no, deviceId:'', faceImg:'', faceMethod:'', violations:0, preBest:null, preLast:null, preAttempts:0, postBest:null, postLast:null, postAttempts:0, lastSubmit:''});
  const view = s => ({key:s.key, name:s.name, cls:s.cls, no:s.no, deviceBound:!!s.deviceId, hasFace:!!s.faceImg, faceMethod:s.faceMethod, violations:s.violations,
    preBest:s.preBest, preLast:s.preLast, preAttempts:s.preAttempts, postBest:s.postBest, postLast:s.postLast, postAttempts:s.postAttempts, lastSubmit:s.lastSubmit});
  let lastId = 0;
  const nid = () => { let id = Date.now(); if (id <= lastId) id = lastId + 1; lastId = id; return id; };
  const ts = () => new Date().toLocaleString('sv-SE').replace('T', ' ');
  const devOK = (d, b) => d.status[b.key] && d.status[b.key].deviceId && d.status[b.key].deviceId === b.deviceId;
  function call(b){
    const d = load(), a = b.action;
    const r = (() => {
      if (a === 'init') return {ok:true, roster:ROSTER, settings:pub(d.settings), classes:CLASSES};
      if (a === 'login'){
        const st = ROSTER.find(x => x.key === b.key);
        if (!st) return {ok:false, error:'not_in_roster'};
        if (isOn(d.settings.deviceOneUser)){
          const other = Object.values(d.status).find(s => s.deviceId === b.deviceId && s.key !== b.key);
          if (other) return {ok:false, error:'device_used', other:other.name};
        }
        let s = d.status[b.key] || (d.status[b.key] = blank(st));
        if (s.deviceId && s.deviceId !== b.deviceId) return {ok:false, error:'device_locked'};
        s.deviceId = b.deviceId;
        return {ok:true, status:view(s), msgs:d.msgs.filter(m => m.key === b.key).slice(-60), settings:pub(d.settings)};
      }
      if (a === 'faceCode') return {ok:String(b.code) === String(d.settings.faceCode)};
      if (a === 'checkPin') return {ok:String(b.pin) === String(d.settings.pin)};
      if (['ping','face','violation','submit','sendMsg','ackMsg'].includes(a) && !devOK(d, b)) return {ok:false, error:'device_locked'};
      if (a === 'ping'){
        d.pres[b.key] = {state:b.state, mode:b.mode, q:b.q, answered:b.answered, ts:Date.now()};
        const msgs = d.msgs.filter(m => m.key === b.key && m.from === 'teacher' && m.id > (b.lastMsgId || 0));
        const res = {ok:true, msgs, setver:d.setver};
        if (String(b.setver || '') !== d.setver) res.settings = pub(d.settings);
        return res;
      }
      if (a === 'face'){ const s = d.status[b.key]; s.faceImg = b.img || ''; s.faceMethod = b.method || ''; return {ok:true}; }
      if (a === 'violation'){ d.status[b.key].violations++; return {ok:true}; }
      if (a === 'submit'){
        const s = d.status[b.key], m = b.mode === 'post' ? 'post' : 'pre';
        if (b.attemptId && d.results.some(x => x.attemptId === b.attemptId)) return {ok:true, dup:true, status:view(s)};
        s[m + 'Attempts']++; s[m + 'Last'] = b.score; s[m + 'Best'] = Math.max(s[m + 'Best'] == null ? -1 : s[m + 'Best'], b.score); s.lastSubmit = ts();
        d.results.push({ts:ts(), key:b.key, mode:m, score:b.score, attemptId:b.attemptId});
        return {ok:true, attempt:s[m + 'Attempts'], status:view(s)};
      }
      if (a === 'sendMsg'){ const t = String(b.text || '').trim().slice(0, 500); if (!t) return {ok:false}; const m = {id:nid(), ts:ts(), key:b.key, from:'student', text:t, read:false}; d.msgs.push(m); return {ok:true, msg:m}; }
      if (a === 'ackMsg'){ d.msgs.forEach(m => { if (m.key === b.key && m.from === 'teacher' && (b.ids || []).map(String).includes(String(m.id))) m.read = true; }); return {ok:true}; }
      /* admin */
      if (String(b.pin) !== String(d.settings.pin)) return {ok:false, error:'bad_pin'};
      if (a === 'adminList'){
        const now = Date.now();
        return {ok:true, list:ROSTER.map(r => {
          const s = d.status[r.key], p = d.pres[r.key] || null, mine = d.msgs.filter(m => m.key === r.key);
          return {key:r.key, name:r.name, cls:r.cls, no:r.no, joined:!!s, st:s ? view(s) : null, online:!!(p && now - p.ts < 20000), presence:p,
            unread:mine.filter(m => m.from === 'student' && !m.read).length, lastMsg:mine.length ? mine[mine.length - 1] : null};
        })};
      }
      if (a === 'adminMsgs'){ d.msgs.forEach(m => { if (m.key === b.key && m.from === 'student') m.read = true; }); return {ok:true, msgs:d.msgs.filter(m => m.key === b.key)}; }
      if (a === 'adminSend'){ const t = String(b.text || '').trim().slice(0, 500); if (!t) return {ok:false}; const m = {id:nid(), ts:ts(), key:b.key, from:'teacher', text:t, read:false}; d.msgs.push(m); return {ok:true, msg:m}; }
      if (a === 'adminBroadcast'){ const t = String(b.text || '').trim().slice(0, 500); if (!t) return {ok:false}; let n = 0; Object.values(d.status).forEach(s => { if (b.cls === 'all' || s.cls === b.cls){ d.msgs.push({id:nid(), ts:ts(), key:s.key, from:'teacher', text:t, read:false}); n++; } }); return {ok:true, count:n}; }
      if (a === 'adminUnlock'){ if (d.status[b.key]) d.status[b.key].deviceId = ''; return {ok:true}; }
      if (a === 'adminReset'){
        let n = 0;
        Object.values(d.status).forEach(s => {
          if (b.key && s.key !== b.key) return;
          if (!b.key && b.cls && b.cls !== 'all' && s.cls !== b.cls) return;
          if (b.scope !== 'post'){ s.preBest = null; s.preLast = null; s.preAttempts = 0; }
          if (b.scope !== 'pre'){ s.postBest = null; s.postLast = null; s.postAttempts = 0; }
          if (b.scope === 'all') s.violations = 0;
          n++;
        });
        return {ok:true, count:n};
      }
      if (a === 'adminFace'){ const s = d.status[b.key]; return {ok:!!s, img:s ? s.faceImg : '', method:s ? s.faceMethod : ''}; }
      if (a === 'adminSettings') return {ok:true, list:Object.keys(DEF).map(k => ({key:k, value:d.settings[k], note:NOTES[k] || ''}))};
      if (a === 'adminSetSetting'){
        if (b.k === 'pin' && !/^\d{4,8}$/.test(String(b.v))) return {ok:false, error:'pin_format'};
        d.settings[b.k] = String(b.v); d.setver = String(Date.now()); return {ok:true};
      }
      return {ok:false, error:'unknown_action'};
    })();
    save(d);
    return new Promise(res => setTimeout(() => res(JSON.parse(JSON.stringify(r))), 120));
  }
  return {call};
})();

async function doLogin(key, silent){
  const btn = $('#btnLogin');
  if (btn){ btn.disabled = true; btn.textContent = '⏳ กำลังตรวจสอบ…'; }
  if (silent) main(`<div style="text-align:center;padding:80px 0"><div class="h1 grad">ยินดีต้อนรับกลับ 👋</div><p class="muted" style="margin-top:8px">กำลังตรวจสอบเครื่อง…</p></div>`);
  const r = await api('login', {key, deviceId:S.deviceId});
  if (!r.ok){
    if (r.error === 'device_locked') return renderLocked(key, 'locked');
    if (r.error === 'device_used') return renderLocked(key, 'used', r.other);
    if (r.error === 'not_in_roster'){ store.del('ppc_me'); toast('ไม่พบชื่อในรายชื่อ กรุณาเลือกใหม่', 'warn'); return renderLogin(); }
    toast('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง', 'warn');
    return silent ? renderLogin() : (btn && (btn.disabled = false, btn.textContent = '🚀 เข้าสู่ระบบ'));
  }
  S.me = S.roster.find(x => x.key === key);
  S.status = r.status;
  if (r.settings) applySettings(r.settings);
  store.set('ppc_me', {key});
  S.chat = (r.msgs || []).map(m => Object.assign(m, {_seen:m.from === 'student' || m.read}));
  S.lastMsgId = S.chat.filter(m => m.from === 'teacher').reduce((m, x) => Math.max(m, x.id), 0);
  // unread teacher messages not yet acknowledged → pop up
  S.chat.filter(m => m.from === 'teacher' && !m.read).forEach(m => queuePopup(m));
  mountChat();
  startPing();
  retryPending();
  const att = store.get('ppc_att_' + key, null);
  if (att && att.answers && att.order && att.order.length === QUESTIONS.length){
    delete att.submitting;
    S.att = att;
    toast('กลับมาทำข้อสอบต่อจากเดิม ✍️', 'good');
    return renderQuiz();
  }
  renderHub();
}

function renderLocked(key, kind, other){
  stopPing();
  const r = S.roster.find(x => x.key === key) || {name:''};
  main(`<div class="card" style="max-width:620px;margin:30px auto;padding:36px;text-align:center">

/* =========================================================
   Face scan (camera) — fallback code 1112
   ========================================================= */
let faceStream = null, faceLoop = null;
function stopCam(){
  if (faceLoop){ cancelAnimationFrame(faceLoop); faceLoop = null; }
  if (faceStream){ faceStream.getTracks().forEach(t => t.stop()); faceStream = null; }
}
function startTest(mode){
  beep('tap');
  const s = S.settings;
  if (!isOn(mode === 'pre' ? s.preOpen : s.postOpen)) return toast('ครูยังไม่เปิดให้ทำชุดนี้', 'warn');
  if (isOn(s.faceScan) && sess.get('ppc_face_' + S.me.key) !== '1') return renderFace(mode);
  beginQuiz(mode);
}
function renderFace(mode){
  setState('face');
  main(`<div class="card face-wrap">
    <span class="eyebrow">📸 ยืนยันตัวตน</span>
    <h2 style="font-weight:900;font-size:26px;margin-top:10px">สแกนใบหน้าก่อนเริ่มสอบ</h2>
    <p class="muted">วางหน้าให้อยู่ในกรอบวงรี มองกล้องนิ่ง ๆ 2 วินาที</p>
    <div class="cam"><video id="faceVid" playsinline muted autoplay></video><div class="oval" id="faceOval"></div><div class="scanline"></div><div class="pct" id="facePct">กำลังเปิดกล้อง…</div><div class="nocam hidden" id="noCam"></div></div>
    <div class="prog"><i id="faceProg"></i></div>
    <div style="margin-top:18px;font-weight:800">สแกนไม่ได้? ใส่รหัสจากครู</div>
    <div class="codebox"><input class="input" id="faceCode" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off"><button class="btn btn-post" id="btnCode">ยืนยัน</button></div>
    <button class="btn btn-ghost btn-sm" id="faceBack" style="margin-top:16px">← กลับ</button>
  </div>`);
  $('#faceBack').onclick = () => { stopCam(); renderHub(); };
  const verifyCode = async () => {
    const code = $('#faceCode').value.trim();
    if (!code) return;
    $('#btnCode').disabled = true;
    const r = await api('faceCode', {code});
    $('#btnCode').disabled = false;
    if (r.ok){ faceDone(mode, '', 'code'); }
    else { beep('warn'); toast(r.error === 'network' ? 'เชื่อมต่อไม่ได้ ลองใหม่' : 'รหัสไม่ถูกต้อง ❌', 'warn'); $('#faceCode').value = ''; }
  };
  $('#btnCode').onclick = verifyCode;
  $('#faceCode').onkeydown = e => { if (e.key === 'Enter') verifyCode(); };
  openCam(mode);
}
async function openCam(mode){
  const vid = $('#faceVid');
  const noCam = msg => { const n = $('#noCam'); if (!n) return; n.classList.remove('hidden'); n.innerHTML = '<div>📷<br>' + msg + '<br><br>ใส่รหัสจากครูด้านล่างได้เลย</div>'; const p = $('#facePct'); if (p) p.classList.add('hidden'); };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return noCam('อุปกรณ์นี้เปิดกล้องไม่ได้');
  try{
    faceStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:480}, height:{ideal:640}}, audio:false});
  }catch(e){ return noCam('ไม่ได้รับอนุญาตให้ใช้กล้อง'); }
  if (!$('#faceVid')){ stopCam(); return; }
  vid.srcObject = faceStream;
  try{ await vid.play(); }catch(e){}
  const cv = document.createElement('canvas'); cv.width = 120; cv.height = 160;
  const ctx = cv.getContext('2d', {willReadFrequently:true});
  const fd = ('FaceDetector' in window) ? (() => { try{ return new window.FaceDetector({fastMode:true, maxDetectedFaces:1}); }catch(e){ return null; } })() : null;
  let hold = 0, last = performance.now(), busy = false, prevLum = null;
  const NEED = 1800;
  const tick = async now => {
    if (!$('#faceVid')){ stopCam(); return; }
    faceLoop = requestAnimationFrame(tick);
    if (busy || vid.readyState < 2) return;
    const dt = Math.min(200, now - last); last = now;
    busy = true;
    let found = false;
    try{
      if (fd){
        const faces = await fd.detect(vid);
        found = faces.length > 0;
      } else {
        ctx.drawImage(vid, 0, 0, cv.width, cv.height);
        const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
        // ตรวจโทนผิว (YCbCr) ภายในวงรีกลางจอ + ความสว่าง + ความนิ่ง
        let skin = 0, tot = 0, lum = 0;
        const cx = cv.width / 2, cy = cv.height * .46, rx = cv.width * .31, ry = cv.height * .31;
        for (let y = 0; y < cv.height; y += 2) for (let x = 0; x < cv.width; x += 2){
          const nx = (x - cx) / rx, ny = (y - cy) / ry;
          if (nx * nx + ny * ny > 1) continue;
          const i = (y * cv.width + x) * 4, R = d[i], G = d[i + 1], B = d[i + 2];
          const Y = .299 * R + .587 * G + .114 * B, Cb = 128 - .168736 * R - .331264 * G + .5 * B, Cr = 128 + .5 * R - .418688 * G - .081312 * B;
          tot++; lum += Y;
          if (Cb >= 77 && Cb <= 135 && Cr >= 133 && Cr <= 180 && Y > 35) skin++;
        }
        lum /= Math.max(1, tot);
        const ratio = skin / Math.max(1, tot);
        const steady = prevLum == null || Math.abs(lum - prevLum) < 14;
        prevLum = lum;
        found = ratio > .32 && lum > 45 && steady;
      }
    }catch(e){ found = false; }
    busy = false;
    hold = found ? hold + dt : Math.max(0, hold - dt * 1.5);
    const p = Math.min(100, hold / NEED * 100);
    const pr = $('#faceProg'), oval = $('#faceOval'), pct = $('#facePct');
    if (pr) pr.style.width = p + '%';
    if (oval) oval.classList.toggle('ok', found);
    if (pct) pct.textContent = found ? `กำลังยืนยัน… ${Math.round(p)}%` : 'ขยับหน้าให้อยู่ในกรอบ';
    if (hold >= NEED){
      cancelAnimationFrame(faceLoop); faceLoop = null;
      const snap = document.createElement('canvas'); snap.width = 160; snap.height = 200;
      const sc = snap.getContext('2d');
      const vw = vid.videoWidth || 480, vh = vid.videoHeight || 640, tw = Math.min(vw, vh * .8);
      sc.translate(160, 0); sc.scale(-1, 1);
      sc.drawImage(vid, (vw - tw) / 2, 0, tw, Math.min(vh, tw * 1.25), 0, 0, 160, 200);
      let img = ''; try{ img = snap.toDataURL('image/jpeg', .62); }catch(e){}
      faceDone(mode, img, fd ? 'face-detector' : 'camera');
    }
  };
  faceLoop = requestAnimationFrame(tick);
}
function faceDone(mode, img, method){
  stopCam();
  beep('ok');
  sess.set('ppc_face_' + S.me.key, '1');
  if (img) store.set('ppc_face_img_' + S.me.key, img);
  api('face', {key:S.me.key, deviceId:S.deviceId, img, method});
  toast(method === 'code' ? 'ยืนยันด้วยรหัสสำเร็จ ✅' : 'สแกนใบหน้าสำเร็จ ✅', 'good');
  beginQuiz(mode);
}

/* =========================================================
   Quiz
   ========================================================= */
function beginQuiz(mode){
  const order = shuffle(QUESTIONS.map((_, i) => i));
  const perm = {};
  order.forEach(i => perm[i] = shuffle([0, 1, 2, 3]));
  S.att = {id:uid(), mode, order, perm, answers:{}, cur:0, start:Date.now(), violations:0, key:S.me.key};
  saveAtt();
  renderQuiz();
}
function saveAtt(){ if (S.att && S.me) store.set('ppc_att_' + S.me.key, S.att); }
function renderQuiz(){
  const A = S.att;
  document.body.classList.toggle('m-post', A.mode === 'post');
  main(`<div class="qtop"><div class="qtop-in">
      <span class="mode-pill ${A.mode}">${A.mode === 'pre' ? 'PRETEST' : 'POST-TEST'}</span>
      <span class="chip">👤 ${esc(S.me.name)} · ม.${esc(S.me.cls)} เลขที่ ${esc(S.me.no)}</span>
      <div class="spacer"></div>
      <span class="chip timer">⏱ <span id="qTimer">00:00</span></span>
      <span class="chip" id="qCount">0/30</span>
    </div><div class="qprog"><i id="qBar" style="width:0"></i></div></div>
    <div id="qArea"></div>
    <div class="card qmap" id="qMap"></div>`);
  clearInterval(S.timerInt);
  const tick = () => { const t = $('#qTimer'); if (!t){ clearInterval(S.timerInt); return; } t.textContent = fmtTime((Date.now() - A.start) / 1000); };
  tick(); S.timerInt = setInterval(tick, 1000);
  drawQuestion();
}
function answeredCount(){ return Object.keys(S.att.answers).length; }
function drawQuestion(){
  const A = S.att, pos = A.cur, qi = A.order[pos], Q = QUESTIONS[qi];
  setState('quiz');
  const qHtml = esc(Q.q).replace(/\n/g, '<br>').replace(/___/g, '<span class="blank"></span>').replace(/\[\[(.+?)\]\]/g, '<u class="mark">$1</u>');
  const letters = ['A','B','C','D'];
  const chosen = A.answers[qi];
  $('#qArea').innerHTML = `<div class="card qcard" translate="no">
    <div class="qmeta"><span class="lv ${Q.lv}">${LV_TH[Q.lv]}</span><span class="qtype">${esc(Q.t)}</span><span class="qno">ข้อ ${pos + 1} / ${A.order.length}</span></div>
    <div class="qtext">${qHtml}${Q.t === 'หาที่ผิด' ? '<span class="th">ส่วนที่ขีดเส้นใต้ส่วนใดผิด?</span>' : ''}</div>
    ${Q.img ? `<img class="qimg" alt="" src="${esc(Q.img)}">` : ''}
    <div class="opts">${A.perm[qi].map((oi, k) => `<button class="opt${chosen === oi ? ' sel' : ''}" data-oi="${oi}"><span class="k">${letters[k]}</span><span>${esc(Q.o[oi])}</span></button>`).join('')}</div>
    <div class="qnav">
      <button class="btn btn-ghost" id="qPrev" ${pos === 0 ? 'disabled' : ''}>← ก่อนหน้า</button>
      <div class="spacer"></div>
      ${pos < A.order.length - 1 ? `<button class="btn ${A.mode === 'pre' ? 'btn-pre' : 'btn-post'}" id="qNext">ถัดไป →</button>` : ''}
      <button class="btn btn-dark" id="qSubmit">✅ ส่งคำตอบ</button>
    </div>
  </div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const oi = Number(b.dataset.oi);
    A.answers[qi] = oi;
    saveAtt(); beep('tap');
    document.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
    updateQuizBars();
    // auto-advance to next question after a short pause
    clearTimeout(drawQuestion._t);
    drawQuestion._t = setTimeout(() => { if (S.att === A && A.cur === pos && pos < A.order.length - 1){ A.cur++; saveAtt(); drawQuestion(); } }, 420);
  });
  $('#qPrev').onclick = () => { if (A.cur > 0){ clearTimeout(drawQuestion._t); A.cur--; saveAtt(); drawQuestion(); } };
  const nx = $('#qNext'); if (nx) nx.onclick = () => { clearTimeout(drawQuestion._t); A.cur++; saveAtt(); drawQuestion(); };
  $('#qSubmit').onclick = askSubmit;
  updateQuizBars();
  if (window.scrollY > 200) window.scrollTo({top:0, behavior:'smooth'});
}
function updateQuizBars(){
  const A = S.att, n = answeredCount(), tot = A.order.length;
  const c = $('#qCount'); if (c) c.textContent = n + '/' + tot;
  const b = $('#qBar'); if (b) b.style.width = (n / tot * 100) + '%';
  const map = $('#qMap');
  if (map){
    map.innerHTML = A.order.map((qi, p) => `<button class="qdot${A.answers[qi] != null ? ' done' : ''}${p === A.cur ? ' cur' : ''}" data-p="${p}">${p + 1}</button>`).join('');
    map.querySelectorAll('.qdot').forEach(d => d.onclick = () => { clearTimeout(drawQuestion._t); A.cur = Number(d.dataset.p); saveAtt(); drawQuestion(); });
  }
}
function askSubmit(){
  const left = S.att.order.length - answeredCount();
  confirmBox(left ? `ยังไม่ได้ตอบอีก ${left} ข้อ` : 'ส่งคำตอบเลยไหม?',
    left ? 'ข้อที่ไม่ได้ตอบจะนับเป็น 0 คะแนน ต้องการส่งเลยไหม?' : 'ตรวจทานครบแล้วใช่ไหม ส่งแล้วแก้ไม่ได้นะ',
    'ส่งคำตอบ', finishQuiz, left ? 'กลับไปทำต่อ' : 'ตรวจทานอีกครั้ง');
}
function scoreAttempt(A){
  const by = {easy:[0,0], medium:[0,0], hard:[0,0]};
  let score = 0;
  QUESTIONS.forEach((Q, i) => { by[Q.lv][1]++; if (A.answers[i] === Q.a){ score++; by[Q.lv][0]++; } });
  return {score, total:QUESTIONS.length, by};
}
async function finishQuiz(){
  const A = S.att;
  if (!A || A.submitting) return;
  A.submitting = true;
  clearInterval(S.timerInt); clearTimeout(drawQuestion._t);
  const sc = scoreAttempt(A);
  const dur = Math.round((Date.now() - A.start) / 1000);
  const ansStr = A.order.map(i => (i + 1) + ':' + (A.answers[i] == null ? '-' : 'ABCD'[A.answers[i]])).join(',');
  const payload = {key:S.me.key, deviceId:S.deviceId, mode:A.mode, attemptId:A.id, score:sc.score, total:sc.total,
    easy:sc.by.easy[0], medium:sc.by.medium[0], hard:sc.by.hard[0], durationSec:dur, violations:A.violations, answers:ansStr};
  const res = {mode:A.mode, score:sc.score, total:sc.total, by:sc.by, dur, answers:A.answers, order:A.order, perm:A.perm, when:nowTh(), attempt:null, violations:A.violations};
  main(`<div style="text-align:center;padding:80px 0"><div class="h1 grad">กำลังส่งคำตอบ…</div><p class="muted" style="margin-top:8px">อย่าเพิ่งปิดหน้านี้นะ</p></div>`);
  const r = await api('submit', payload);
  store.del('ppc_att_' + S.me.key);
  S.att = null;
  if (r.ok){
    S.status = r.status || S.status;
    res.attempt = r.attempt || (S.status && S.status[A.mode + 'Attempts']) || null;
  } else {
    if (r.error === 'device_locked') { const pl = store.get('ppc_pending_list', []); pl.push(payload); store.set('ppc_pending_list', pl); return renderLocked(S.me.key, 'locked'); }
    const pend = store.get('ppc_pending_list', []); pend.push(payload); store.set('ppc_pending_list', pend);
    toast('ส่งคะแนนไม่สำเร็จ ระบบจะส่งให้อัตโนมัติเมื่อเน็ตกลับมา', 'warn');
    // update locally so hub reflects it
    const st = S.status || (S.status = {});
    st[A.mode + 'Attempts'] = (st[A.mode + 'Attempts'] || 0) + 1;
    st[A.mode + 'Last'] = sc.score;
    st[A.mode + 'Best'] = Math.max(st[A.mode + 'Best'] == null ? -1 : st[A.mode + 'Best'], sc.score);
    res.attempt = st[A.mode + 'Attempts'];
  }
  S.lastResult = res;
  renderResult(res);
}
async function retryPending(){
  const pend = store.get('ppc_pending_list', []);
  if (!pend.length || !S.me) return;
  const keep = [];
  for (const p of pend){
    if (p.key !== S.me.key){ keep.push(p); continue; }
    const r = await api('submit', Object.assign({}, p, {deviceId:S.deviceId}));
    if (r.ok){ if (r.status) S.status = r.status; } else keep.push(p);
  }
  store.set('ppc_pending_list', keep);
  if (keep.length < pend.length) toast('ส่งคะแนนที่ค้างไว้สำเร็จ ✅', 'good');
}

function gradeOf(p){
  if (p >= 90) return {t:'ยอดเยี่ยม 🏆', c:'linear-gradient(135deg,#FFB800,#FF6B6B)'};
  if (p >= 75) return {t:'ดีมาก 🌟', c:'linear-gradient(135deg,#12B8A6,#38BDF8)'};
  if (p >= 60) return {t:'ดี 👍', c:'linear-gradient(135deg,#7C5CFF,#38BDF8)'};
  if (p >= 50) return {t:'ผ่าน ✅', c:'linear-gradient(135deg,#FF9F43,#FFC93C)'};
  return {t:'สู้ ๆ นะ 💪', c:'linear-gradient(135deg,#FF7EB6,#FF6B6B)'};
}

function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function loadImg(src){ return new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
async function buildCard(res){

  const face = await loadImg(store.get('ppc_face_img_' + S.me.key, ''));
  c.save(); c.beginPath(); c.arc(170, 405, 70, 0, Math.PI * 2); c.closePath(); c.clip();
  if (face){ c.drawImage(face, 100, 335, 140, 175); }
  else { const ag = c.createLinearGradient(100, 335, 240, 475); ag.addColorStop(0, '#7C5CFF'); ag.addColorStop(1, '#12B8A6'); c.fillStyle = ag; c.fillRect(100, 335, 140, 140); c.fillStyle = '#fff'; c.font = `900 64px ${FONT}`; c.textAlign = 'center'; c.fillText(initials(S.me.name), 170, 428); c.textAlign = 'left'; }
  c.restore();
  c.fillStyle = '#2A2142'; c.font = `900 50px ${FONT}`; c.fillText(S.me.name, 270, 395, W - 380);
  c.fillStyle = '#6E6688'; c.font = `700 32px ${FONT}`; c.fillText('ชั้น ม.' + S.me.cls + '   ·   เลขที่ ' + S.me.no, 270, 450);
  // score ring
  const cx = 300, cy = 760, R = 170;
  c.lineWidth = 34; c.strokeStyle = '#EFE8F6'; c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.stroke();
  const rg = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  if (pre){ rg.addColorStop(0, '#FF6B6B'); rg.addColorStop(1, '#FFC93C'); } else { rg.addColorStop(0, '#7C5CFF'); rg.addColorStop(1, '#12B8A6'); }
  c.strokeStyle = rg; c.lineCap = 'round'; c.beginPath(); c.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(.001, res.score / res.total)); c.stroke();
  c.textAlign = 'center'; c.fillStyle = '#2A2142'; c.font = `900 120px ${FONT}`; c.fillText(String(res.score), cx, cy + 30);
  c.fillStyle = '#6E6688'; c.font = `800 36px ${FONT}`; c.fillText('/ ' + res.total + '  ·  ' + pct + '%', cx, cy + 86);
  c.textAlign = 'left';
  // grade pill
  const gp = c.createLinearGradient(560, 600, 1000, 680); gp.addColorStop(0, pre ? '#FF6B6B' : '#7C5CFF'); gp.addColorStop(1, pre ? '#FFC93C' : '#12B8A6');
  rr(c, 560, 600, 450, 92, 46); c.fillStyle = gp; c.fill();

  // info tiles

  c.fillText('Basic English Course · By T.OAT · Thanakhan-oomsin School', W / 2, 1250);
  c.font = `700 22px ${FONT}`; c.fillStyle = '#A79FBC'; c.fillText('ID ' + S.deviceId.slice(-6) + ' · ' + new Date().toLocaleString('sv-SE'), W / 2, 1292);

function confetti(){
  const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#FF6B6B','#FF9F43','#FFC93C','#12B8A6','#38BDF8','#7C5CFF','#FF7EB6'];
  const ps = Array.from({length:140}, () => ({x:Math.random() * W, y:-20 - Math.random() * H * .5, vx:(Math.random() - .5) * 4, vy:2 + Math.random() * 4, r:4 + Math.random() * 6, c:cols[Math.random() * cols.length | 0], a:Math.random() * 6, va:(Math.random() - .5) * .3}));
  let t = 0;
  const loop = () => {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
    if (++t < 220) requestAnimationFrame(loop); else cv.remove();
  };
  loop();
}

let curState = 'hub';
function setState(s){ curState = s; }
function startPing(){
  stopPing();
  const run = async () => {
    if (!S.me) return;
    const A = S.att;
    const r = await api('ping', {key:S.me.key, deviceId:S.deviceId, state:curState, mode:A ? A.mode : '', q:A ? A.cur + 1 : 0, answered:A ? answeredCount() : 0, lastMsgId:S.lastMsgId, setver:S.setver});
    if (!r.ok){
      if (r.error === 'device_locked'){ stopCam(); clearInterval(S.timerInt); unmountChat(); return renderLocked(S.me.key, 'locked'); }
      return;
    }
    if (r.setver) S.setver = r.setver;
    if (r.settings){
      const before = JSON.stringify([S.settings.preOpen, S.settings.postOpen, S.settings.announce, S.settings.heroImg, S.settings.preImg, S.settings.postImg]);
      applySettings(r.settings);
      const after = JSON.stringify([S.settings.preOpen, S.settings.postOpen, S.settings.announce, S.settings.heroImg, S.settings.preImg, S.settings.postImg]);
      if (before !== after && curState === 'hub' && !$('.modal-bg')) renderHub();
    }
    (r.msgs || []).forEach(m => {
      if (m.id <= S.lastMsgId || S.chat.some(x => x.id === m.id)) return;
      S.lastMsgId = Math.max(S.lastMsgId, m.id);
      S.chat.push(m);
      queuePopup(m);
    });
    renderChatBody();
  };
  S.pingInt = setInterval(run, PING_MS);
  run();
}
function stopPing(){ clearInterval(S.pingInt); S.pingInt = null; }

function mountChat(){

}
function unmountChat(){ $('#chatRoot').innerHTML = ''; S.chatOpen = false; }
function updateBadge(){

/* =========================================================
   Anti-cheat (นับการออกจากหน้าจอระหว่างสอบ)
   ========================================================= */
document.addEventListener('visibilitychange', () => {
  if (!S.att || curState !== 'quiz' || !isOn(S.settings.antiCheat)) return;
  if (document.hidden){
    S.att.violations = (S.att.violations || 0) + 1; saveAtt();
    api('violation', {key:S.me.key, deviceId:S.deviceId});
  } else {
    beep('warn');
    toast(`⚠️ ตรวจพบการออกจากหน้าข้อสอบ (${S.att.violations} ครั้ง) ครูเห็นนะ 👀`, 'warn');
  }
});
// Translator detection — แอปเปลี่ยนข้อความด้วย innerHTML เสมอ การแก้ text node ตรง ๆ = ตัวแปลภาษา
new MutationObserver(list => {
  if (!S.att || curState !== 'quiz') return;
  if (list.some(m => m.type === 'characterData' && m.target.parentElement && m.target.parentElement.closest('.qcard'))){
    if (!S.att._tr){ S.att._tr = true; S.att.violations++; saveAtt(); api('violation', {key:S.me.key, deviceId:S.deviceId}); toast('⚠️ ห้ามใช้ตัวแปลภาษานะ', 'warn'); }
  }
}).observe(document.getElementById('main'), {subtree:true, characterData:true});

    const d = document.createElement('div'); d.className = 'drawer'; d.id = 'admDrawer';
    d.innerHTML = `<div class="chat-head"><div class="avatar" style="width:40px;height:40px;border-radius:14px;font-size:17px;background:rgba(255,255,255,.25)">${esc(initials(x.name))}</div><div>${esc(x.name)}<div style="font-size:12px;font-weight:600;opacity:.9">ม.${esc(x.cls)} · เลขที่ ${esc(x.no)} · ข้อความจะเด้งที่จอนักเรียน</div></div><div class="spacer"></div><button id="dX" style="color:#fff;font-size:22px">✕</button></div>
      <div class="chat-body" id="aBody"><div class="chat-empty">กำลังโหลด…</div></div>
      <div class="quick">${QUICK.map(q => `<button>${esc(q)}</button>`).join('')}</div>
      <form class="chat-form" id="aForm"><input class="input" id="aIn" maxlength="500" placeholder="พิมพ์ข้อความถึง ${esc(x.name)}…" autocomplete="off"><button class="btn btn-pre btn-sm">ส่ง</button></form>`;
    document.body.appendChild(d);
    $('#dX').onclick = closeChat;
    d.querySelectorAll('.quick button').forEach(b => b.onclick = () => { $('#aIn').value = b.textContent; $('#aIn').focus(); });
    $('#aForm').onsubmit = async e => {
      e.preventDefault();
      const t = $('#aIn').value.trim(); if (!t) return;
      $('#aIn').value = '';
      const r = await api('adminSend', {pin, key, text:t});
      if (!r.ok){ toast('ส่งไม่สำเร็จ', 'warn'); $('#aIn').value = t; } else beep('ok');
      loadChat();
    };
    loadChat();
    clearInterval(chatPoll); chatPoll = setInterval(loadChat, ADMIN_POLL_MS);
  }
  function closeChat(){ chatKey = null; clearInterval(chatPoll); const d = $('#admDrawer'); if (d) d.remove(); }
  async function loadChat(){
    const key = chatKey; if (!key) return;
    const r = await api('adminMsgs', {pin, key});
    if (!r.ok || key !== chatKey) return;
    const b = $('#aBody'); if (!b) return;
    const sig = JSON.stringify(r.msgs.map(m => [m.id, m.read]));
    if (b.dataset.sig === sig) return;
    b.dataset.sig = sig;
    b.innerHTML = r.msgs.length ? r.msgs.map(m => `<div class="msg ${m.from === 'teacher' ? 'me' : 'them'}">${esc(m.text)}<small>${esc(fmtTs(m.ts))}${m.from === 'teacher' ? (m.read ? ' · ✓ รับทราบแล้ว' : ' · ส่งแล้ว') : ''}</small></div>`).join('') : '<div class="chat-empty">ยังไม่มีข้อความ<br>ทักนักเรียนได้เลย ข้อความจะเด้งขึ้นจอ</div>';
    b.scrollTop = b.scrollHeight;
    const row = list.find(y => y.key === key); if (row){ row.unread = 0; if (tab === 'live') drawTable(); }
  }
  function broadcast(){
    const m = modal(`<h3>📣 ส่งข้อความถึงหลายคน</h3><p class="muted">ข้อความจะเด้งขึ้นจอของนักเรียนที่เคยเข้าระบบ</p>
      <div class="field" style="margin-top:12px"><label>ส่งถึง</label><select class="select" id="bcCls"><option value="all">ทุกห้อง</option>${CLASSES.map(c => `<option value="${c}">ม.${c}</option>`).join('')}</select></div>
      <div class="field" style="margin-top:10px"><label>ข้อความ</label><textarea class="input" id="bcTxt" rows="3" maxlength="500"></textarea></div>
      <div class="acts"><button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-post" id="bcGo">ส่ง</button></div>`);
    m.querySelector('#bcGo').onclick = async () => {
      const t = m.querySelector('#bcTxt').value.trim(); if (!t) return;
      m.querySelector('#bcGo').disabled = true;
      const r = await api('adminBroadcast', {pin, cls:m.querySelector('#bcCls').value, text:t});
      m.remove(); toast(r.ok ? `ส่งแล้ว ${r.count} คน ✅` : 'ไม่สำเร็จ', r.ok ? 'good' : 'warn');
    };
  }
  return {gate};
})();

boot();
</script>
</body>
</html>
